<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Perfume</title>
</head>
<body>

   <main>
    <section id="front">

        <picture class="picture">
            <source
                media="(max-width: 600px)"
                srcset="image-product-mobile.jpg"
            >
                
            <img src="image-product-desktop.jpg" alt="na zdjęciu znajduje się flakon perfum Gabrielle Chanel">
        </picture>
        
        <section id="content">
            <div class="title">
                <p>Perfume</p>
            </div>
            <div class="main-title">
                <h1>
                    Gabrielle
                    Essence Eau
                    De Parfum
                </h1>
            </div>
            
            <div class="description">
                <p>
                    A floral, solar and voluptuous interpretaion composed by Olivier Polge, 
                    Perfumer-Creator for the House of CHANEL.
                </p>

            </div>

            <div class="price">
                <div class="current-price">
                    <span> $149.99</span>
                </div>
                <div class="outdated-price">
                    <span><s>$169.99</s></span>
                </div>
                
            </div>
            <div class="button">
                
                <button type="button"> 
                    <img src="./icon-cart.svg" alt="icon">Add to Cart
                </button> 
                
            </div>
        </section>
    </section>


   </main> 
    
</body>
</html>
